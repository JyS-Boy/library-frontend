<div class="page">

  <h1>Lectores</h1>

  <a routerLink="/readers/new">
    Nuevo Lector
  </a>

  <table>

    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>

      @for (
        reader of readers();
        track reader.id
      ) {

        <tr>

          <td>
            <a [routerLink]="['/readers', reader.id]">
            {{ reader.fullName }}
            </a>
          </td>

          <td>
            {{ reader.email }}
          </td>

          <td>
            <a [routerLink]="['/readers', reader.id, 'edit']">
              Editar
            </a>
            @if (isAdmin) {
               |
              <button
              type="button"
              (click)="deleteReader(reader.id)">
              Eliminar
              </button>
            }
          </td>
        </tr>
      }

    </tbody>

  </table>
  
    <app-pagination [pageNumber]="pageNumber()" [totalPages]="totalPages()" (previous)="previousPage()"
        (next)="nextPage()">
    </app-pagination>
</div>
