<div class="page">

  <h1>Detalle del Lector</h1>

  @if (reader()) {

    <div class="card">

      <div class="row">
        <strong>Id:</strong>
        <span>{{ reader()?.id }}</span>
      </div>

      <div class="row">
        <strong>Nombre:</strong>
        <span>{{ reader()?.fullName }}</span>
      </div>

      <div class="row">
        <strong>Email:</strong>
        <span>{{ reader()?.email }}</span>
      </div>

      <div class="row">
        <strong>Teléfono:</strong>
        <span>{{ reader()?.phoneNumber }}</span>
      </div>

      <div class="row">
        <strong>Usuario:</strong>
        <span>
          {{ reader()?.userName || 'Sin usuario asociado' }}
        </span>
      </div>

    </div>

  } @else {

    <p>Cargando...</p>

  }

</div>
