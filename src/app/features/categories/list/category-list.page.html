<div class="page">

  <h1>Categorías</h1>

  <a
    routerLink="/categories/new">

    Nueva Categoría

  </a>

  <table>

    <thead>

      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>

    </thead>

    <tbody>

      @for (
        category of categories();
        track category.id
      ) {

        <tr>

          <td>

            <a
              [routerLink]="[
                '/categories',
                category.id
              ]">

              {{ category.name }}

            </a>

          </td>

          <td>
            {{ category.description }}
          </td>

          <td>

            <a
              [routerLink]="[
                '/categories',
                category.id,
                'edit'
              ]">

              Editar

            </a>

            @if (isAdmin) {

              |

              <button
                type="button"
                (click)="
                  deleteCategory(
                    category.id
                  )
                ">

                Eliminar

              </button>

            }

          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
