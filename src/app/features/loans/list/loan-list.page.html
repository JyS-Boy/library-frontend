<div class="page">
    <h1>Préstamos</h1>
    <a routerLink="/loans/new">Nuevo Préstamo</a>

    <table>
        <thead>
            <tr>
                <th>Lector</th>
                <th>Fecha de préstamo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            @for (loan of loans(); track loan.id){
            <tr>
                <td>
                    <a [routerLink]="['/loans', loan.id]">
                        {{ loan.reader }}
                    </a>
                </td>
                <td>{{ loan.loanDate | date:'dd/MM/yyyy HH:mm' }}</td>
                <td>
                    @if (loan.status === 'Registered') {
                    <span class="badge badge-active">Registrado</span>
                    } @else {
                    <span class="badge badge-returned">Devuelto</span>
                    }
                </td>

                <td>
                    <a [routerLink]="['/loans', loan.id]">Detalle</a>
                    @if (loan.status === 'Registered') {
                    |
                    <button type="button" (click)="returnLoan(loan.id)">Devolver
                    </button>
                    }
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
