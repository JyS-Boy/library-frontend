<div class="page">
  <h1>Nuevo Autor</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="name">
    </div>

    <div class="form-group">
      <label>País</label>
      <input type="text" formControlName="country">
    </div>

    <button type="submit" [disabled]="loading">{{ loading ? 'Guardando...' : 'Guardar' }}</button>
  </form>
</div>
